# name: Name of the program or language. Used to identify which process to spawn (e.g. 'ls').
#       Does not need to match the command of the process. Only needs to be unique.
#
# cmd: Command of the process to spawn (e.g. 'ls').
#
# draw: Whether the client is expected to handle the output of the spawned process.
#       If false, the client should cease output to the terminal for the duration of the process.
#       default: true
#
# file: File extension of the language (e.g. 'c', 'cpp', 'rs').
#
# limits: Resource limits for this program or language. Any key given here
#         overrides the top-level 'limits' default; keys left out inherit it.

# Firejail is the only security boundary. The program/language names above are
# a convenience, not an allowlist: anything reachable from 'bash' (or a shell
# expansion such as $(...), `...`, &&) runs too, so every restriction must be
# enforced here. The command itself is appended as: sh -c '<cmd>'.
sandbox:
  - firejail
  - --quiet
  - --hostname=demonic
  - --private
  - --private-tmp
  - --chroot=/srv/chroot
  - --net=none
  - --noroot
  - --caps.drop=all
  - --seccomp
  - --nonewprivs
  - --env=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games
  - --env=LC_ALL=en_US.UTF-8

# Default resource limits, passed to Firejail as --rlimit-nproc, --rlimit-as,
# --rlimit-fsize and --timeout. Sizes accept K, M and G suffixes.
#   nproc:   max processes/threads (stops fork bombs)
#   as:      max address space (virtual memory) per process
#   fsize:   max size of any file written
#   timeout: wall-clock limit for the whole sandbox (hh:mm:ss)
limits:
  nproc: 64
  as: 512M
  fsize: 16M
  timeout: "00:10:00"

root: /srv/chroot

# programs
progs:
  palindrome: {}

  prime: {}

  withfeathers:
    cmd: python /srv/withfeathers.py

  cmatrix: {}
  cowsay: {}
  fortune: {}
  lolcat: {}
  pipes.sh: {}
  hollywood: {}

  cat: {}
  cd: {}
  echo: {}
  less: {}
  ls: {}
  man: {}
  mv: {}
  pwd: {}
  rm: {}
  which: {}

  vim:
    draw: false

  bash:
    draw: false

# languages
langs:
  c:
    ext: c
    cmd:
      - gcc -o <path> <path>.c
      - <path>

  c++:
    ext: cpp
    cmd:
      - g++ -o <path> <path>.cpp
      - <path>

  go:
    ext: go
    cmd: go run <path>.go
    limits:
      as: 3G   # the Go runtime reserves ~2G of address space up front

  haskell:
    ext: hs
    cmd: ghci <path>.hs
    limits:
      as: 2G

  java:
    ext: java
    cmd:
      - CLASS=$(grep "class" <path>.java | cut -d " " -f 3)
      - NEW_PATH=<path>-java
      - mkdir -p $NEW_PATH
      - mv <path>.java $NEW_PATH/$CLASS.java
      - cd $NEW_PATH
      - javac $CLASS.java
      - java $CLASS
    limits:
      as: 4G   # the JVM reserves heap + class space up front

  javascript:
    ext: js
    cmd: node <path>.js

  python:
    ext: py
    cmd: python <path>.py

  scheme:
    ext: rkt
    cmd: racket <path>.rkt

  ruby:
    ext: rb
    cmd: ruby <path>.rb

  rust:
    ext: rs
    cmd:
      - rustc -o <path> <path>.rs
      - <path>
    limits:
      as: 2G

  shell:
    ext: sh
    cmd: sh <path>.sh

